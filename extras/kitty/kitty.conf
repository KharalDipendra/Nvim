# ─── BLACK THEME ──────────────────────────────────────
background           #0d0d0d
foreground           #d8d8d8
cursor               #d8d8d8
selection_background #2a2a2a
selection_foreground #ffffff
active_border_color  #4a4a4a

# Normal colors
color0 #0d0d0d  # black
color1 #ff5458  # red
color2 #62d196  # green
color3 #ffb378  # yellow
color4 #65b2ff  # blue
color5 #b48cff  # magenta
color6 #63f2f1  # cyan
color7 #d8d8d8  # white

# Bright colors
color8  #4a4a4a  # bright black
color9  #ff8080  # bright red
color10 #95ffa4  # bright green
color11 #ffe9aa  # bright yellow
color12 #91ddff  # bright blue
color13 #c991e1  # bright magenta
color14 #aaffe4  # bright cyan
color15 #ffffff  # bright white

# ─── SHELL ────────────────────────────────────────────
# (kitty's default: your login shell, zsh on both Linux and macOS)

# ─── FONTS ────────────────────────────────────────────

font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 15.0
modify_font cell_height 110%

# ─── WINDOW ────────────────────────────────────────────

window_padding_width 10
hide_window_decorations no

# ─── CURSOR ────────────────────────────────────────────

cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# ─── TAB BAR ────────────────────────────────────────────
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background   #2a2a2a
active_tab_foreground   #ffffff
inactive_tab_background #0d0d0d
inactive_tab_foreground #8a8a8a

# Let nvim go fullscreen / drop padding while it runs (socket only, path set per OS below)
allow_remote_control socket-only

# ─── PER-OS ────────────────────────────────────────────
# KITTY_OS is "linux" or "macos": loads linux.conf or macos.conf from this folder
include ${KITTY_OS}.conf
